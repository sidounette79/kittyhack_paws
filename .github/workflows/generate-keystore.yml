name: Generate Kittyhack Android signing keystore (one-time)

# 07.10, Sid ("integrer le hash pour que je puisse reinstaller par-dessus"):
# run ONCE to create a stable signing keystore, then never again - every
# android-app.yml build after that reuses the same key via the
# KITTYHACK_KEYSTORE_* secrets below, so a new build installs over an old
# one without losing local app data/settings. Re-running this would
# generate a DIFFERENT key and break that guarantee for anyone who already
# installed a build signed with the old one - don't re-run casually.
#
# The keystore + its passwords are uploaded as a build ARTIFACT, not
# printed to the (public) workflow log - download it from the run's
# Summary page, then add these 4 repo secrets yourself (Settings > Secrets
# and variables > Actions > New repository secret), same place as
# GOOGLE_SERVICES_JSON:
#   KITTYHACK_KEYSTORE_BASE64    <- base64 of the .jks file (see README.txt
#                                    in the artifact for the exact command)
#   KITTYHACK_KEYSTORE_PASSWORD  <- from README.txt in the artifact
#   KITTYHACK_KEY_ALIAS          <- "kittyhack"
#   KITTYHACK_KEY_PASSWORD       <- same as KITTYHACK_KEYSTORE_PASSWORD
# Then delete the artifact once the secrets are saved - it's the only copy
# outside GitHub's encrypted secret store, keep it only as long as needed.

on:
  push:
    paths:
      - ".github/workflows/generate-keystore.yml"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Generate keystore
        # 07.10, Sid (real incident, not her mistake): the first version of
        # this step put a literal, unexecuted command string
        # "(base64 -w0 kittyhack-release.jks)" on the KITTYHACK_KEYSTORE_BASE64
        # line of README.txt, meant as a note on how the value was derived -
        # but it reads exactly like a value, so Sid copied that text itself
        # into the secret ("base64: invalid input" downstream). Fixed by
        # computing the base64 into a shell variable FIRST and substituting
        # the real value directly into the heredoc - nothing left to
        # mistake for a placeholder.
        run: |
          PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          keytool -genkeypair -v \
            -keystore kittyhack-release.jks \
            -alias kittyhack \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Kittyhack, OU=sidounette79, O=sidounette79, L=, ST=, C=CH"
          KEYSTORE_B64=$(base64 -w0 kittyhack-release.jks)
          echo "$KEYSTORE_B64" > kittyhack-release.jks.base64
          cat > README.txt <<EOF
          Kittyhack Android signing keystore - generated $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Add these as repo secrets (Settings > Secrets and variables > Actions).
          Copy each value EXACTLY as printed below, nothing more/less:

          KITTYHACK_KEYSTORE_BASE64:
          $KEYSTORE_B64

          KITTYHACK_KEYSTORE_PASSWORD:
          $PASSWORD

          KITTYHACK_KEY_ALIAS:
          kittyhack

          KITTYHACK_KEY_PASSWORD:
          $PASSWORD

          Then delete this artifact - this file is the only copy of the
          password outside GitHub's encrypted secret store.
          EOF

      - name: Self-check - round-trip the base64 and print a non-secret fingerprint
        # 07.10, Sid: proves two things without exposing any key material in
        # the (public) log - just an ::notice:: annotation, visible even
        # without the admin rights normal log download needs: (1) the
        # base64 written to README.txt genuinely decodes back to a
        # byte-for-byte identical keystore, and (2) the keystore really
        # holds the expected CN=Kittyhack cert. keytool -list's output goes
        # to a file, never the log, in case -v leaked more than intended.
        run: |
          base64 -d kittyhack-release.jks.base64 > roundtrip-check.jks
          if cmp -s kittyhack-release.jks roundtrip-check.jks; then
            echo "::notice::Round-trip OK - README.txt's base64 decodes back to a byte-identical keystore (size: $(stat -c%s kittyhack-release.jks) bytes)."
          else
            echo "::error::Round-trip MISMATCH - the base64 in README.txt/kittyhack-release.jks.base64 does NOT decode back to the same keystore. Do not use this artifact."
            exit 1
          fi
          keytool -list -v -keystore kittyhack-release.jks -storepass "$(grep -A1 KITTYHACK_KEYSTORE_PASSWORD README.txt | tail -1)" > keytool_output.txt 2>&1
          owner_line=$(grep "Owner:" keytool_output.txt || echo "NOT FOUND")
          echo "::notice::Certificate owner line: ${owner_line}"
          rm -f roundtrip-check.jks keytool_output.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kittyhack-signing-keystore
          path: |
            kittyhack-release.jks
            kittyhack-release.jks.base64
            README.txt
          retention-days: 7
