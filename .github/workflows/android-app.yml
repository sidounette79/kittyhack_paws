name: Build Kittyhack Android app

# 07.10, Sid: real native Android builds (Gradle/Android SDK) must never run
# on the NAS - same lesson already learned the hard way with Moonfin/CARBA
# TV, which build via GitHub Actions exclusively. This workflow is the only
# place `gradlew assembleDebug` should ever run for this project.

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for `gh release create` below

    # 07.10, Sid (real error from the GitHub Actions UI - the API never
    # surfaced it): "secrets" cannot be referenced directly inside an `if:`
    # expression, that's a documented GitHub Actions restriction, not
    # something specific to this workflow - the whole file failed to parse
    # (0 jobs created) because of it. Fix: expose it as a job-level env var
    # first, then check THAT in `if:` instead of `secrets.*` directly.
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # 07.10, Sid: same "secrets not allowed directly in if:" restriction -
      # exposed as env first (see generate-keystore.yml for how these 4 get
      # created; absent/empty until Sid adds them as repo secrets, build
      # still runs fine without them, just unsigned-consistently like before).
      KITTYHACK_KEYSTORE_BASE64: ${{ secrets.KITTYHACK_KEYSTORE_BASE64 }}
      KITTYHACK_KEYSTORE_PASSWORD: ${{ secrets.KITTYHACK_KEYSTORE_PASSWORD }}
      KITTYHACK_KEY_ALIAS: ${{ secrets.KITTYHACK_KEY_ALIAS }}
      KITTYHACK_KEY_PASSWORD: ${{ secrets.KITTYHACK_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Decode google-services.json
        # Requires a repo secret GOOGLE_SERVICES_JSON holding the base64
        # content of the Firebase-generated google-services.json (Settings
        # > Secrets and variables > Actions). Firebase project setup itself
        # is a manual step Sid has to do in the Firebase console - see the
        # project README/report for exact steps. Skipped (not failed) until
        # that secret exists - the build will still run, just without a
        # working push-notifications plugin until Firebase is wired in.
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Decode signing keystore
        if: ${{ env.KITTYHACK_KEYSTORE_BASE64 != '' }}
        env:
          KITTYHACK_KEY_ALIAS: ${{ secrets.KITTYHACK_KEY_ALIAS }}
          KITTYHACK_KEYSTORE_PASSWORD: ${{ secrets.KITTYHACK_KEYSTORE_PASSWORD }}
        # 07.10, Sid (first real attempt after she added the 4 secrets
        # failed right here): the secret is almost certainly fine - the
        # most common real cause is copy-paste whitespace (a trailing
        # newline, or line-wrapping) in the pasted base64, which GNU
        # base64 -d normally tolerates but is worth stripping defensively
        # anyway. The actual fix is verifying the decode succeeded at all,
        # with a clear message, instead of silently producing a 0-byte or
        # garbage file that only fails much later at the Gradle signing
        # step with a far less obvious error.
        run: |
          set +e
          # 07.10, Sid: second attempt still failed with exit 1 and NO
          # visible reason (log download needs admin rights I don't have,
          # only ::error:: annotations are visible to me) - almost
          # certainly base64 -d itself erroring out (missing '=' padding
          # from a copy-paste that trimmed trailing characters is the
          # classic cause), which under the shell's default errexit killed
          # the script before ever reaching last attempt's own checks.
          # set +e here so THIS script survives long enough to report
          # exactly what happened instead of just "exit code 1".
          raw="$(echo "$KITTYHACK_KEYSTORE_BASE64" | tr -d '[:space:]')"
          len=${#raw}
          pad=$(( (4 - len % 4) % 4 ))
          for i in $(seq 1 $pad); do raw="${raw}="; done
          echo "Secret length after stripping whitespace: ${len} chars (added ${pad} padding '=' to reach a multiple of 4)."
          # 07.10, Sid: previous attempt's `2>&1` landed AFTER the `>file`
          # redirect, so it duplicated stderr onto the FILE, not into the
          # $() capture (which only ever sees stdout - empty by
          # construction once stdout is redirected to the file). That's why
          # the error text came back blank last time. stderr now goes to
          # its own separate file instead.
          printf '%s' "$raw" | base64 -d > android/app/kittyhack-release.jks 2>/tmp/base64_decode.err
          decode_status=$?
          decode_err=$(cat /tmp/base64_decode.err)
          if [ $decode_status -ne 0 ]; then
            echo "::error::base64 -d failed (exit ${decode_status}): ${decode_err}. KITTYHACK_KEYSTORE_BASE64 secret is not valid base64 - re-copy it from kittyhack-release.jks.base64 in the generate-keystore.yml artifact, the whole content of that file and nothing else."
            exit 1
          fi
          size=$(stat -c%s android/app/kittyhack-release.jks 2>/dev/null || echo 0)
          echo "Decoded keystore size: ${size} bytes"
          if [ "$size" -lt 100 ]; then
            echo "::error::Decoded keystore is suspiciously small (${size} bytes) - KITTYHACK_KEYSTORE_BASE64 secret is likely wrong/corrupted."
            exit 1
          fi
          keytool -list -keystore android/app/kittyhack-release.jks \
            -storepass "$KITTYHACK_KEYSTORE_PASSWORD" -alias "$KITTYHACK_KEY_ALIAS"
          if [ $? -ne 0 ]; then
            echo "::error::keytool could not read the decoded keystore with the given alias/password - check KITTYHACK_KEYSTORE_PASSWORD/KITTYHACK_KEY_ALIAS secrets match what generate-keystore.yml's README.txt said."
            exit 1
          fi
          set -e

      - name: Sync Capacitor
        run: node node_modules/.bin/cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        # chmod defensively - a committed gradlew losing +x (e.g. a NAS
        # filesystem not preserving the bit, or a git clone on a mode-
        # insensitive filesystem) is a real failure mode already hit once
        # setting this up, not a hypothetical.
        env:
          KITTYHACK_KEYSTORE_PATH: ${{ env.KITTYHACK_KEYSTORE_BASE64 != '' && 'kittyhack-release.jks' || '' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kittyhack-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a numbered GitHub release
        # 07.10, Sid ("chaque APK buildé sauvegardé... garder les anciennes
        # versions"): a public release asset is fetchable with a plain
        # unauthenticated curl (unlike a CI artifact, which needs an API
        # token) - that's what lets the backup-to-OLDMEDIA step run from
        # outside this workflow without needing any new credential. One
        # release per build number, never overwritten.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 07.10, Sid (found while depositing the first build on OLDMEDIA):
          # gh release's `file#label` syntax only sets a display LABEL, the
          # stored asset filename stays the original basename regardless -
          # rename the local copy first so the actual downloadable filename
          # is correct too, not just how it's labeled in the GitHub UI.
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "kittyhack-build-${{ github.run_number }}.apk"
          gh release create "android-build-${{ github.run_number }}" \
            "kittyhack-build-${{ github.run_number }}.apk" \
            --title "Kittyhack Android build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}."
