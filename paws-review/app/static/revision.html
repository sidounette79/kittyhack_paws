<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révision - Paws Review</title>
<meta name="theme-color" content="#121316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paws Review">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Paws Review</h1>
  <div class="tabs" id="page-nav"></div>
  <div class="tabs" id="sub-nav"></div>
  <!-- 20.10, Sid ("le module de revérification... je contrôle tout au
       même endroit") -->
  <div class="export-bar" id="model-review-bar" hidden></div>
  <!-- 20.10, Sid ("un bouton qui sort aussi la comparaison") -->
  <div class="export-bar" id="compare-bar" hidden></div>
  <!-- 22.10, Sid ("il me faut un onglet spécifique") -->
  <div class="export-bar" id="rebalance-bar" hidden></div>
</header>

<!-- Équilibrage réutilise la grille + le détail génériques (comme Photos). -->
<div id="queue" class="queue-grid"></div>
<div id="empty" class="empty-state" hidden>Rien ici pour l'instant.</div>
<div id="bulk-bar" class="bulk-bar" hidden></div>

<div id="detail">
  <div class="detail-top">
    <button onclick="closeDetail()">&larr; retour</button>
    <span class="mono" id="detail-meta" style="font-size:12px;color:var(--text-dim)"></span>
  </div>
  <div class="image-wrap" id="image-wrap">
    <img id="detail-img" src="" alt="">
  </div>
  <div class="hint">Touche une boîte pour corriger son étiquette. Trace un rectangle sur une zone vide pour ajouter une détection manquée.</div>
  <div class="box-list" id="box-list"></div>
  <div class="actions">
    <div class="actions-row">
      <button class="btn-reject" onclick="submitReview('rejected')">Écarter</button>
      <button class="btn-confirm" onclick="submitReview('confirmed')">Valider</button>
    </div>
    <div class="actions-row">
      <button class="btn-nav" onclick="navigateDetail(-1)">&larr; Précédent</button>
      <button class="btn-nav" onclick="navigateDetail(1)">Suivant &rarr;</button>
    </div>
  </div>
</div>

<!-- 20.10, Sid ("le module de revérification... je contrôle tout au même
     endroit") - vue dédiée (son éditeur de boîtes glisser/déposer est bâti
     pour corriger la vérité terrain, pas pour comparer ancien/nouveau) :
     juste deux boîtes en lecture seule (ancien en orange, nouveau en bleu)
     et deux décisions. -->
<div id="mr-detail">
  <div class="detail-top">
    <button onclick="closeMrDetail()">&larr; retour</button>
    <span class="mono" id="mr-detail-meta" style="font-size:12px;color:var(--text-dim)"></span>
  </div>
  <div class="image-wrap" id="mr-image-wrap" onclick="toggleMrZoom()">
    <img id="mr-detail-img" src="" alt="">
  </div>
  <div class="mr-legend">
    <span class="mr-chip mr-old" id="mr-old-chip"></span>
    <span class="mr-chip mr-new" id="mr-new-chip"></span>
  </div>
  <div class="actions">
    <div class="actions-row">
      <button class="btn-reject" onclick="resolveMrCurrent('dismiss')">Garder l'ancien</button>
      <button class="btn-confirm" onclick="resolveMrCurrent('apply')">Appliquer le nouveau</button>
    </div>
    <div class="actions-row">
      <button class="btn-nav" onclick="navigateMrDetail(-1)">&larr; Précédent</button>
      <button class="btn-nav" onclick="navigateMrDetail(1)">Suivant &rarr;</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script src="/nav.js"></script>
<script src="/revision.js"></script>
</body>
</html>
