<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Identité - Paws Review</title>
<meta name="theme-color" content="#121316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paws Review">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Paws Review</h1>
  <div class="tabs" id="page-nav"></div>
  <div class="export-bar" id="review-bar"></div>
</header>

<!-- 01.11, Sid ("je ne vois pas les boîtes... si la photo comporte une
     boîte alors qu'il n'y a aucun chat je fais quoi ?") - même éditeur de
     boîtes que Révision/Photos (common.js:renderDetail), pas une vue
     maison : la boîte est dessinée sur l'image en vrai, son nom se
     change via le menu déroulant (corrige l'identité), "supprimer"
     l'écarte ("pas un chat"), tracer un rectangle sur une zone vide
     ajoute un chat manqué. Cette page n'est qu'une file triée/filtrée
     vers cet éditeur. -->
<div id="queue" class="queue-grid"></div>
<div id="empty" class="empty-state" hidden>Rien à revoir pour l'instant - le Modèle 2 n'a rien de peu sûr récemment.</div>

<div id="detail">
  <div class="detail-top">
    <button onclick="backToQueue()">&larr; retour</button>
    <span class="mono" id="detail-meta" style="font-size:12px;color:var(--text-dim)"></span>
  </div>
  <div class="image-wrap" id="image-wrap">
    <img id="detail-img" src="" alt="">
  </div>
  <div class="hint">Touche la boîte pour corriger son nom ou l'écarter (pas un chat). Trace un rectangle sur une zone vide pour ajouter un chat manqué.</div>
  <div class="box-list" id="box-list"></div>
  <div class="actions">
    <div class="actions-row">
      <button class="btn-nav" onclick="navigateDetail(-1)">&larr; Précédent</button>
      <button class="btn-nav" onclick="navigateDetail(1)">Suivant &rarr;</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script src="/nav.js"></script>
<script src="/identite.js"></script>
</body>
</html>
