<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entraînement - Paws Review</title>
<meta name="theme-color" content="#121316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paws Review">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Paws Review</h1>
  <div class="tabs" id="page-nav"></div>
  <!-- 18.10, Sid ("un bouton qui lance l'export des photos validées...
       une notif qui dit que le zip est prêt") - état persistant (survit
       au rechargement de la page, voir pollExportStatus() dans
       entrainement.js). -->
  <div class="export-bar" id="export-bar"></div>
  <!-- 19.10, Sid ("crée le bouton et on teste ensuite en live") - même
       pattern persistant que export-bar. -->
  <div class="export-bar" id="train-bar"></div>
  <!-- 29.10, plan de scission détection/identité (Phase 2) - entraînement
       séparé du Modèle 2 (identité), même pattern persistant que
       train-bar, jamais le même état (les deux entraînements sont
       indépendants, voir train_vastai_identity.py). -->
  <div class="export-bar" id="identity-train-bar"></div>
  <!-- 26.10, Sid ("un onglet complémentaire avec ce qui fait déjà partie
       du zip") - Validées (pas encore exportées) / Exportées (déjà dans un
       zip, confirmed/corrected seulement - jamais les écartées, qui se
       font aussi marquer exported_at sans jamais finir dans le zip). -->
  <div class="tabs" id="sub-nav"></div>
  <!-- 25.10, Sid ("filtre chats+proie+HK/reo dans validées") -->
  <div class="export-bar" id="reviewed-filter-bar"></div>
</header>

<div id="queue" class="queue-grid"></div>
<div id="empty" class="empty-state" hidden>Rien ici pour l'instant.</div>

<div id="bulk-bar" class="bulk-bar" hidden></div>

<div id="detail">
  <div class="detail-top">
    <button onclick="closeDetail()">&larr; retour</button>
    <span class="mono" id="detail-meta" style="font-size:12px;color:var(--text-dim)"></span>
  </div>
  <div class="image-wrap" id="image-wrap">
    <img id="detail-img" src="" alt="">
  </div>
  <div class="hint">Touche une boîte pour corriger son étiquette. Trace un rectangle sur une zone vide pour ajouter une détection manquée.</div>
  <div class="box-list" id="box-list"></div>
  <div class="actions">
    <div class="actions-row">
      <button class="btn-reject" onclick="submitReview('rejected')">Écarter</button>
      <button class="btn-confirm" onclick="submitReview('confirmed')">Valider</button>
    </div>
    <div class="actions-row">
      <button class="btn-nav" onclick="navigateDetail(-1)">&larr; Précédent</button>
      <button class="btn-nav" onclick="navigateDetail(1)">Suivant &rarr;</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script src="/nav.js"></script>
<script src="/entrainement.js"></script>
</body>
</html>
